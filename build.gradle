plugins {
    id 'java'
    id("xyz.jpenilla.run-paper") version "2.3.1"
}

group = 'org.lseixas'
version = '0.1'

sourceSets {
    main {
        java {
            srcDirs = ['main/java']
        }
        resources {
            srcDirs = ['main/resources']
        }
    }
    test {
        java {
            srcDirs = ['src/test/java']
        }
        resources {
            srcDirs = ['src/test/resources']
        }
    }
}

repositories {
    mavenCentral()
    maven {
        name = "spigotmc-repo"
        url = "https://hub.spigotmc.org/nexus/content/repositories/snapshots/"
    }
    maven {
        name = "papermc"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
}

dependencies {
    compileOnly("org.spigotmc:spigot-api:1.21.8-R0.1-SNAPSHOT")

    testImplementation("org.junit.jupiter:junit-jupiter:5.11.4")
    testRuntimeOnly("org.junit.platform:junit-platform-launcher")
    testImplementation("org.mockbukkit.mockbukkit:mockbukkit-v1.21:4.45.1")
}

tasks {
    runServer {
        minecraftVersion("1.21")
    }

    jar {
        archiveFileName = "plugin_mineguerra.jar"
    }

    test {
        useJUnitPlatform()
        testLogging {
            events "passed", "skipped", "failed"
        }
    }
}

// Local-only deploy: copy JAR after jar/build when gradle.local.properties exists.
def localGradlePropsFile = file('gradle.local.properties')
if (localGradlePropsFile.exists()) {
    def localProps = new Properties()
    localGradlePropsFile.withInputStream { localProps.load(it) }
    def configuredDir = localProps.getProperty('deploy.pluginsDir')?.trim()
    if (configuredDir) {
        def localDeployDir = file(configuredDir)
        tasks.register('copyJarToLocalServer', Copy) {
            group = 'distribution'
            description = 'Copies the plugin JAR to the local Minecraft plugins folder.'
            onlyIf { localDeployDir.directory }
            from(tasks.named('jar').flatMap { it.archiveFile })
            into(localDeployDir)
            doFirst {
                logger.lifecycle("Copying plugin JAR to ${localDeployDir}")
            }
        }
        tasks.named('jar').configure {
            finalizedBy('copyJarToLocalServer')
        }
    }
}

def targetJavaVersion = 21
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release.set(targetJavaVersion)
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}
