plugins {
    id 'java'
    id("xyz.jpenilla.run-paper") version "2.3.1"
}

group = 'org.lseixas'
version = '0.1'

sourceSets {
    main {
        java {
            srcDirs = ['main/java']
        }
        resources {
            srcDirs = ['main/resources']
        }
    }
}

repositories {
    mavenCentral()
    maven {
        name = "spigotmc-repo"
        url = "https://hub.spigotmc.org/nexus/content/repositories/snapshots/"
    }
}

dependencies {
    compileOnly("org.spigotmc:spigot-api:1.21.8-R0.1-SNAPSHOT")
}

tasks {
    runServer {
        // Configure the Minecraft version for our task.
        // This is the only required configuration besides applying the plugin.
        // Your plugin's jar (or shadowJar if present) will be used automatically.
        minecraftVersion("1.21")
    }

    jar {
        archiveFileName = "plugin_mineguerra.jar"
    }

}

// Local-only deploy: copy JAR after jar/build when gradle.local.properties exists.
// Other machines without that file skip this entirely (no task wired).
def localGradlePropsFile = file('gradle.local.properties')
if (localGradlePropsFile.exists()) {
    def localProps = new Properties()
    localGradlePropsFile.withInputStream { localProps.load(it) }
    def configuredDir = localProps.getProperty('deploy.pluginsDir')?.trim()
    if (configuredDir) {
        def localDeployDir = file(configuredDir)
        tasks.register('copyJarToLocalServer', Copy) {
            group = 'distribution'
            description = 'Copies the plugin JAR to the local Minecraft plugins folder.'
            onlyIf { localDeployDir.directory }
            from(tasks.named('jar').flatMap { it.archiveFile })
            into(localDeployDir)
            doFirst {
                logger.lifecycle("Copying plugin JAR to ${localDeployDir}")
            }
        }
        tasks.named('jar').configure {
            finalizedBy('copyJarToLocalServer')
        }
    }
}

def targetJavaVersion = 21
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'

    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release.set(targetJavaVersion)
    }
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}
