name: mineguerra_plugins
version: '0.1'
main: org.lseixas.mineguerra_plugins.Mineguerra_plugins
api-version: '1.21'
commands:
  spawnvillager:
    description: Spawna villagers customizados
    usage: /spawnvillager <tipo> [x] [y] [z]
    permission: mineguerra.spawnvillager
    aliases: [ sv, villager ]
  startGuerra:
    description: Cronograma do evento (fases, PvP, hardcore, world border)
    usage: /startGuerra <start|stop|status|phase|reload|reset>
    permission: mineguerra.admin
    aliases: [ guerra, sg ]
  grantSoulflayerBow:
    description: Te da o item arco do wither
    usage: /grantSoulflayerBow
    permission: mineguerra.admin
  grantDragonSlayer:
    description: Te da o item dragon slayer
    usage: /grantDragonSlayer
    permission: mineguerra.admin
  grantDoomHammer:
    description: Te da o item doom hammer
    usage: /grantDoomHammer
    permission: mineguerra.admin
  grantStormRider:
    description: Te da o item storm rider
    usage: /grantStormRider
    permission: mineguerra.admin
  grantTraderTool:
    description: Ferramenta para spawnar ou configurar villagers do evento
    usage: /grantTraderTool <tipo>
    permission: mineguerra.tradertool
    aliases: [ gtt, tradertool ]
  grantTraderToolKit:
    description: Da as 4 ferramentas dos exploradores de armas
    usage: /grantTraderToolKit
    permission: mineguerra.tradertool
    aliases: [ gttk ]
  team:
    description: Gerencia times do evento (criar, join, leave, flag)
    usage: "/team <create|delete|join|leave|clear|list|info|flag> ..."
    permission: mineguerra.team
    aliases: [ t, time ]
  mg:
    description: Admin MineGuerra (leaderboard, kills, weapons, revive)
    usage: /mg <leaderboard|kills|weapons|revive> ...
    permission: mineguerra.admin
  grantNoSpawnTool:
    description: Ferramenta para delimitar areas sem spawn de mobs
    usage: /grantNoSpawnTool [tool|list|clear]
    permission: mineguerra.nospawn
    aliases: [ gnst, nospawntool ]
  grantNoBreakTool:
    description: Ferramenta para delimitar areas onde blocos nao podem ser quebrados
    usage: /grantNoBreakTool [tool|list|clear]
    permission: mineguerra.nobreak
    aliases: [ gnbt, nobreaktool ]
permissions:
  mineguerra.admin:
    description: Admin do evento (grants, mg, startGuerra)
    default: op
  mineguerra.team:
    description: Gerenciar times e bandeiras
    default: op
  mineguerra.tradertool:
    description: Ferramentas de spawn/config de villagers
    default: op
  mineguerra.nospawn:
    description: Delimitar areas sem spawn de mobs
    default: op
  mineguerra.nobreak:
    description: Delimitar areas onde blocos nao podem ser quebrados
    default: op
  mineguerra.spawnvillager:
    description: Comando legado de spawn de villager
    default: op
