# Allowlist estrita do cliente Fabric 1.21.8 (Guerra).
# Copiado para plugins/mineguerra_plugins/client-allowlist.yml na primeira subida.
# Assinatura exact: todos os ids abaixo, nem extra nem faltando. Versoes nao sao pinadas.

enabled: true
timeoutTicks: 100
bypassPermission: mineguerra.admin
mode: exact
expectedMcVersion: "1.21.8"

requiredMods:
  - mineguerra-client-audit

# IDs do fabric.mod.json (nao o slug do Modrinth).
# fabric-api fica de fora: prefixo fabric- e ignorado.
# sodium entra porque Iris + Reese's Sodium Options dependem dele.
allowedMods:
  - mineguerra-client-audit
  - cloth-config
  - debugify
  - dynamic_fps
  - entityculling
  - ferritecore
  - immediatelyfast
  - iris
  - krypton
  - lithium
  - modmenu
  - moreculling
  - reeses-sodium-options
  - placeholder-api
  - yet_another_config_lib_v3
  - sodium

ignoredModIds:
  - minecraft
  - java
  - fabricloader
  - mixinextras

ignoredModIdPrefixes:
  - fabric-

# SHA-1 do zip resourcepack/MineGuerra_Weapons.zip (pack.mcmeta na raiz).
# Recalcular apos alterar texturas: sha1sum MineGuerra_Weapons.zip
allowedPackSha1:
  - b5d400b5b99d32a7b55ef22beeac475dbd70293b

# Shader desligado (string vazia) continua ok. Nome Iris pode incluir .zip / versao.
allowedShaders:
  - miniature shader by ukrech
  - complementary unbound
  - complementary reimagined

bannedShaderSubstrings:
  - xray
  - cave finder
  - cave-finder
  - cave_finder
  - fullbright
  - wallhack
  - esp
